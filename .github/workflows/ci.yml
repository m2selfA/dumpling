name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows GUI + CLI
    # GitHub-hosted runners currently provide Windows Server labels, not Windows 10.
    # Use a self-hosted runner with the win10 label for exact Windows 10 validation.
    runs-on: ${{ vars.DUMPLING_WINDOWS_RUNNER || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --release --features gui
      - run: cargo test --all-targets --release --features gui
      - run: cargo clippy --all-targets --release --features gui -- -D warnings
      - run: cargo build --release --bins --features gui

  macos:
    name: macOS GUI + CLI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --release --features gui
      - run: cargo test --all-targets --release --features gui
      - run: cargo clippy --all-targets --release --features gui -- -D warnings
      - run: cargo build --release --bins --features gui

  linux-cli:
    name: Linux CLI (glibc 2.17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check and build in manylinux2014
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              rustup component add rustfmt clippy
              cargo fmt --all -- --check
              cargo check --bin dumpling-cli --release
              cargo test --bin dumpling-cli --release
              cargo clippy --bin dumpling-cli --release -- -D warnings
              cargo build --bin dumpling-cli --release
              ldd --version | head -1
              glibc_symbols=$(objdump -T target/release/dumpling-cli | grep -oE "GLIBC_[0-9.]+" | sort -V | uniq || true)
              printf "%s\n" "$glibc_symbols" | tail -1
              if printf "%s\n" "$glibc_symbols" | grep -E "GLIBC_2\\.(1[8-9]|[2-9][0-9])|GLIBC_[3-9]" >/dev/null; then
                echo "dumpling-cli requires glibc newer than 2.17" >&2
                exit 1
              fi
            '
